<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/checkout.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">

<i class="fa-solid fa-store"></i>

E-Commerce

</div>


<a href="detail.html">

<i class="fa-solid fa-arrow-left"></i>

Kembali Belanja

</a>


</nav>




<!-- CHECKOUT -->

<div class="checkout-container">


<!-- ALAMAT -->

<div class="left">


<div class="card">


<h2>

<i class="fa-solid fa-location-dot"></i>

Alamat Pengiriman

</h2>


<div class="form">


<label>Nama Penerima</label>

<input 
type="text"
placeholder="Masukkan nama">


<label>Nomor Telepon</label>

<input 
type="number"
placeholder="08xxxxxxxxxx">


<label>Alamat Lengkap</label>

<textarea 
placeholder="Masukkan alamat lengkap"></textarea>


<label>Kode Pos</label>

<input 
type="number"
placeholder="Kode Pos">


</div>


</div>





<!-- PRODUK -->


<div class="card">


<h2>

<i class="fa-solid fa-box"></i>

Produk Pesanan

</h2>


<div class="product">


<img src="https://picsum.photos/120">


<div>

<h3>
Headset Gaming RGB
</h3>


<p>
Jumlah : 1
</p>


<b>
Rp450.000
</b>


</div>


</div>


</div>





<!-- PENGIRIMAN -->


<div class="card">


<h2>

<i class="fa-solid fa-truck"></i>

Metode Pengiriman

</h2>


<label class="radio">

<input type="radio" checked>

Reguler (3-5 Hari) - Rp15.000

</label>



<label class="radio">

<input type="radio">

Express (1-2 Hari) - Rp30.000

</label>



<label class="radio">

<input type="radio">

Same Day - Rp50.000

</label>


</div>


</div>
<!-- PEMBAYARAN -->

<div class="card">


<h2>

<i class="fa-solid fa-credit-card"></i>

Metode Pembayaran

</h2>



<label class="radio">

<input type="radio" name="payment" checked>

COD (Bayar di Tempat)

</label>



<label class="radio">

<input type="radio" name="payment">

Transfer Bank

</label>



<label class="radio">

<input type="radio" name="payment">

QRIS

</label>



<label class="radio">

<input type="radio" name="payment">

E-Wallet

</label>



</div>



</div>




<!-- RINGKASAN -->

<div class="right">


<div class="summary">


<h2>

Ringkasan Belanja

</h2>



<div class="row">

<span>Subtotal Produk</span>

<b>Rp450.000</b>

</div>



<div class="row">

<span>Ongkir</span>

<b>Rp15.000</b>

</div>



<div class="row">

<span>Diskon</span>

<b>-Rp50.000</b>

</div>



<hr>



<div class="total">

<span>Total Pembayaran</span>

<h2>

Rp415.000

</h2>

</div>



<button class="pay">

<i class="fa-solid fa-money-check-dollar"></i>

Bayar Sekarang

</button>



</div>


</div>



</div>



</body>

</html>
